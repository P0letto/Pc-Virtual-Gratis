name: Windows 11 VM

on:
  workflow_dispatch:

jobs:
  virtual-pc:
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar sistema
        run: sudo apt-get update

      - name: Instalar QEMU
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Criar disco virtual
        run: |
          qemu-img create -f qcow2 windows11.qcow2 120G

      - name: Verificar QEMU
        run: qemu-system-x86_64 --version

      - name: Preparar ambiente
        run: |
          echo "Windows 11 VM preparada"
          echo "CPU: 8 cores"
          echo "RAM: 16 GB"
          echo "Disco: 120 GB"

      - name: Iniciar configuração
        run: |
          qemu-system-x86_64 \
            -enable-kvm \
            -machine q35 \
            -cpu host \
            -smp 8 \
            -m 16G \
            -drive file=windows11.qcow2,format=qcow2 \
            -nographic &
          sleep 20
          echo "VM iniciada"
